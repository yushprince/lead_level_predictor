name: lead_level_predictor
description: A Flutter app to predict blood lead levels based on user inputs.
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: '>=3.1.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.6
  # Pin to 0.10.3 to avoid the UnmodifiableUint8ListView API that ships with 0.10.4
  # (not available on older stable Flutter channels yet).
  tflite_flutter: 0.10.3

flutter:
  uses-material-design: true
  assets:
    - assets/models/
